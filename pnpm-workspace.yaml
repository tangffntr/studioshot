packages:
  - 'packages/*'

allowBuilds:
  better-sqlite3: set this to true or false
  esbuild: set this to true or false

# 允许执行构建脚本的原生依赖（pnpm 11+ 安全策略）
# 注：本环境 pnpm 11.1.3 的 onlyBuiltDependencies 自动批准不生效，
# better-sqlite3 / sharp 的 .node 二进制需在首次 install 后手动触发：
#   cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 && npm run install
#   cd node_modules/.pnpm/sharp@*/node_modules/sharp && npm run install
# pnpm 11.8+ 可直接识别此字段自动构建。
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
